<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - LearnAYOP</title>
    <meta name="description" content="Gérer les cours de LearnAYOP.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/progress.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">Learn<span>AYOP</span></a>
        <button class="burger" id="burger" type="button"
                aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="main-nav">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <nav class="nav-links" id="main-nav" aria-label="Navigation principale">
            <a href="index.html"><i class="fa-solid fa-house" aria-hidden="true"></i> Accueil</a>
            <a href="courses.html"><i class="fa-solid fa-book-open" aria-hidden="true"></i> Tous les cours</a>
            <a href="dashboard.html#en-cours"><i class="fa-solid fa-circle-play" aria-hidden="true"></i> Mes cours commencés</a>
            <a href="administration.html" class="active"><i class="fa-solid fa-user-shield" aria-hidden="true"></i> Administration</a>
        </nav>
    </header>

    <main>
        <div class="topbar">
            <label class="search-box">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="search-input"
                       placeholder="Rechercher un cours (nom, id, matière...)">
            </label>
            <select id="filter-level" class="filter-select" aria-label="Filtrer par niveau">
                <option value="">Tous les niveaux</option>
                <option value="Licence">Licence</option>
                <option value="Cycle">Cycle</option>
                <option value="Master">Master</option>
            </select>
            <select id="filter-subject" class="filter-select" aria-label="Filtrer par matière">
                <option value="">Toutes les matières</option>
                <option value="Math">Math</option>
                <option value="Info">Info</option>
                <option value="Elec">Élec</option>
            </select>
            <button type="button" id="reset-filters" class="reset-button">Réinitialiser</button>
        </div>

        <section class="popular-courses section-container">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">ADMINISTRATION</p>
                    <h1>Tous les cours</h1>
                </div>
                <a href="ajouter-cours.html" class="primary-button">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i> Ajouter un cours
                </a>
            </div>

            <!-- Les cartes sont générées par courses-render.js -->
            <div class="course-grid" id="course-grid">
                <p class="no-results" id="no-results">
                    Aucun cours ne correspond à votre recherche.
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">Learn<span>AYOP</span></a>
        <p>Apprendre aujourd'hui, réussir demain.</p>
        <p>© 2026 LearnAYOP — Mini plateforme d'apprentissage.</p>
    </footer>

    <script src="js/menu.js" defer></script>
    <script src="js/catalogue.js"></script>
    <script src="js/donnees-cours.js"></script>
    <script src="js/cours-admin-store.js"></script>
    <script src="js/courses-render.js"></script>
    <script>
        // Administration : on retire le lien « Voir le cours » de chaque carte
        document.querySelectorAll('.course-button').forEach(function (b) {
            b.remove();
        });
         </script>
    <script src="js/progress.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
